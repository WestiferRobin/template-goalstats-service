# Identity comes from the explicit Compose project selected by scripts/workflow.py.
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: goalstats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup}
      POSTGRES_DB: goalstats_template_py_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalstats -d goalstats_template_py_local"]
      interval: 1s
      timeout: 3s
      retries: 40
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 40
  app:
    image: goalstats-template-py:runtime
    build:
      context: ..
      target: runtime
    init: true
    stop_grace_period: 15s
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://goalstats:${POSTGRES_PASSWORD}@postgres:5432/goalstats_template_py_local
      REDIS_URL: redis://redis:6379/0
      CACHE_KEY_PREFIX: goalstats-template-py:local:v1
      OPENAPI_ENABLED: "true"
      LOG_LEVEL: INFO
    ports: ["127.0.0.1:${APP_PORT:-5100}:8000"]
    command: ["flask", "--app", "main:create_app()", "run", "--host=0.0.0.0", "--port=8000", "--reload", "--no-debugger"]
    volumes:
      - ../src:/app/src:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
